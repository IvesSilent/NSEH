<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if lang == 'en' %}NSEH — Leaderboard{% else %}NSEH — 排行榜{% endif %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='NSEH_rank.css') }}?v=5.1.0">
</head>
<body data-i18n-title-key="rank.title">
<div class="container">
    <header>
        <h1>
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke-width="1.2" stroke="currentColor" style="vertical-align:-5px;margin-right:6px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 01-.982-3.172M9.497 14.25a7.454 7.454 0 00.981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 007.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721A7.456 7.456 0 0112 2.25c1.16 0 2.27.13 3.31.38M5.25 9.728h.01m0 0a.01.01 0 01-.01-.01m13.5-5.492c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0016.27 9.728M18.75 4.236V4.5c0 2.108-.966 3.99-2.48 5.228m0 0h.01a.01.01 0 00.01-.01"/>
          </svg>
          <span data-i18n="rank.title2">用户排行榜</span>
        </h1>
        <p data-i18n="rank.subtitle">根据每次进化实验的最佳适应度排名</p>
        <div class="rank-header-actions">
            <button type="button" class="lang-btn" data-i18n-lang-btn data-i18n-title="header.langTitle">English</button>
            <a href="/" class="back-link">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
              </svg>
              <span data-i18n="rank.back">返回主页</span>
            </a>
        </div>
    </header>

    <table class="rank-table">
        <thead>
            <tr>
                <th style="width:60px" data-i18n="rank.colRank">排名</th>
                <th data-i18n="rank.colUser">用户</th>
                <th data-i18n="rank.colBest">最佳适应度</th>
            </tr>
        </thead>
        <tbody id="rank-body"></tbody>
    </table>
</div>
<script src="{{ url_for('static', filename='i18n.js') }}?v=5.1.0"></script>
<script src="{{ url_for('static', filename='NSEH_rank.js') }}?v=5.1.0"></script>
</body>
</html>
